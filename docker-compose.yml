# DataRobort 全栈一键部署（v1.0）
# 前置：cp .env.example .env 并填入 OPENAI_API_KEY；宿主已构建沙箱镜像
#   docker build -f docker/sandbox/Dockerfile -t datarobort-sandbox:latest .
# 启动：docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: datarobort-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: datarobort
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${PLATFORM_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化自动建 demo_business 并灌入 128 订单演示数据
      - ./docs/sql/demo-data.sql:/docker-entrypoint-initdb.d/demo-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [datarobort]

  redis:
    image: redis:8
    container_name: datarobort-redis
    restart: unless-stopped
    ports:
      - "${SPIKE_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [datarobort]

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: datarobort-backend
    restart: unless-stopped
    environment:
      PLATFORM_DB_HOST: mysql
      PLATFORM_DB_PORT: "3306"
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-datarobort}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-root}
      PLATFORM_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      SPIKE_REDIS_HOST: redis
      SPIKE_REDIS_PORT: "6379"
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-datarobort-sandbox:latest}
      SANDBOX_MAX_CONCURRENCY: ${SANDBOX_MAX_CONCURRENCY:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY 必填，请复制 .env.example 为 .env 并配置}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-qwen3.7-plus}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      MCP_SERVER_ENABLED: ${MCP_SERVER_ENABLED:-true}
      DATAROBORT_CRYPTO_KEY: ${DATAROBORT_CRYPTO_KEY:-datarobort-dev-key-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000}
      TZ: Asia/Shanghai
    volumes:
      # 沙箱通过宿主 daemon 执行容器（backend 因此拥有 daemon 权限，
      # 安全缓解见 DEPLOY.md「已知风险」）
      - /var/run/docker.sock:/var/run/docker.sock
      - reports-data:/app/reports
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [datarobort]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: datarobort-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [datarobort]

volumes:
  mysql-data:
  reports-data:

networks:
  datarobort:
    driver: bridge
