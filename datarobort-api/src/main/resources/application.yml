server:
  port: 8080

spring:
  application:
    name: datarobort
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:3307}/${PLATFORM_DB_NAME:datarobort}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PLATFORM_DB_USER:root}
    password: ${PLATFORM_DB_PASSWORD:root123}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 16
      max-wait: 5000
      validation-query: SELECT 1
      test-while-idle: true
  ai:
    openai:
      # Any OpenAI-compatible endpoint: Qwen (DashScope compatible mode),
      # DeepSeek, or a self-hosted vLLM gateway.
      # The runtime key comes from the model_config table; this is only a
      # bootstrap fallback and must be provided via the OPENAI_API_KEY env var.
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:qwen3.7-plus}
          temperature: 0.1
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:qwen3.7-text-embedding}
    mcp:
      server:
        # MCP Server over SSE (Claude Desktop: "url": "http://localhost:8080/sse")
        enabled: ${MCP_SERVER_ENABLED:true}
        stdio: false
        name: datarobort
        version: 0.1.0
        type: SYNC
        protocol: SSE
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # data-locations: classpath:data.sql  # 平台种子数据（暂空）

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  level:
    com.datarobort: info

mybatis:
  configuration:
    map-underscore-to-camel-case: true

datarobort:
  # AES master key for secrets at rest (api keys, datasource passwords).
  # Override with DATAROBORT_CRYPTO_KEY in production.
  crypto-key: ${DATAROBORT_CRYPTO_KEY:datarobort-dev-key-2026}
  spike:
    # Spike B: Redis 8 instance with the query engine (vector search).
    redis-host: ${SPIKE_REDIS_HOST:localhost}
    redis-port: ${SPIKE_REDIS_PORT:6380}
    # Spike C: sandbox image used to run untrusted Python code.
    sandbox-image: ${SANDBOX_IMAGE:datarobort-sandbox:latest}
    sandbox-timeout-seconds: 60
    # Max concurrent sandbox containers (semaphore, fail-fast beyond this).
    sandbox-max-concurrency: ${SANDBOX_MAX_CONCURRENCY:2}
    # Never auto-pull the sandbox image at runtime; build it explicitly.
    # (Prevents an attacker with compose access from swapping the image.)
    sandbox-allow-pull: false
  security:
    # SQL 1st line of defense: when true, a table referenced by the LLM that
    # is missing from ds_table metadata (whitelist) is rejected.
    sql-whitelist-required: false
    # Hard cap enforced at execution time (SqlLimitEnforcer + Druid WallFilter).
    sql-max-rows: 500
  concurrency:
    # Max concurrently running chat graph pipelines (semaphore in ChatController).
    max-graph-threads: 8
  upload:
    # Knowledge-base document upload cap (MB).
    max-size-mb: 20
  cors:
    # Comma-separated explicit origins; no credentials, no wildcard.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
